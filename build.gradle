plugins {
    id 'xyz.wagyourtail.unimined' apply false
}

def targetTable = new groovy.json.JsonSlurper().parse(file('targets.json'))
// 各ビルド対象に、世代 (era) ごとの設定を合わせたもの
def panoramaOnly = (providers.gradleProperty('panoramaOnly').orNull ?: '').tokenize(',')
ext.panoramaTargets = targetTable.targets.findAll {
    panoramaOnly.isEmpty() || it.name in panoramaOnly
}.collect { target ->
    def era = targetTable.eras[target.era]
    if (era == null) throw new GradleException("Unknown era '${target.era}' in targets.json")
    [sources: era, fabricLoader: targetTable.fabricLoader] + target
}

allprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(rootProject.compile_jdk as int)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            // Minecraft 1.14 - 1.16 は Java 8 で動くので、すべてのクラスを Java 8 形式 (major 52) で出力する
            options.compilerArgs += ['-Xlint:-options']
        }
    }
}

// 対象ごとの jar を別のビルドで作ってある場合の、その置き場所。
// 指定すると、対象の Minecraft の準備をせずに、置いてある jar から配布するファイルを組み立てる
ext.panoramaPrebuilt = providers.gradleProperty('panoramaPrebuilt').map { file(it) }.orNull

if (panoramaPrebuilt == null) {
    panoramaTargets.each { target ->
        project(":targets:${target.name}") {
            ext.spec = target
            apply from: rootProject.file('gradle/target.gradle')
        }
    }
}

// 対象ごとの jar を 1 か所に集める (別のビルドで panoramaPrebuilt として使う)。
// 置き場所は build/prebuilt/<対象>.jar
tasks.register('exportRemapped', Sync) {
    into layout.buildDirectory.dir('prebuilt')
    panoramaTargets.each { target ->
        from(project(":targets:${target.name}").tasks.named('remapJar').flatMap { it.archiveFile }) {
            rename { "${target.name}.jar" }
        }
    }
}
